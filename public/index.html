<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">
        🤖 My AI Assistant
    </div>

    <div class="chat-box" id="response">
    </div>

    <div class="input-area">
        <input
            type="text"
            id="message"
            placeholder="Ask anything..."
        >

        <button onclick="sendMessage()">
            Send
        </button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
